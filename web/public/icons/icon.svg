<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E63FF"/>
      <stop offset="100%" style="stop-color:#0D1B3D"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <g transform="translate(256, 240)">
    <!-- Magnifying glass circle -->
    <circle cx="-20" cy="-10" r="90" fill="none" stroke="white" stroke-width="24" opacity="0.95"/>
    <!-- Magnifying glass handle -->
    <line x1="45" y1="55" x2="110" y2="120" stroke="white" stroke-width="28" stroke-linecap="round" opacity="0.95"/>
    <!-- Downward trend arrow inside lens -->
    <polyline points="-70,-45 -30,-15 0,-35 40,15" fill="none" stroke="#22C1C3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arrow head -->
    <polyline points="20,5 40,15 30,-5" fill="none" stroke="#22C1C3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
